name: Refresh ASCII profile card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: ascii-card
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        env:
          GH_HANDLE: gabrieljdsena
          GH_ROLE: Developer
          GH_STATUS: GitHub for personal projects
        run: |
          pip install --quiet pillow
          python scripts/generate_card.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/dark_mode.svg output/light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged - nothing to commit."
          else
            git commit -m "chore: refresh ASCII profile card"
            git push
          fi

      - name: Verify SVG
        run: |
          test -s output/dark_mode.svg
          grep -q "<svg" output/dark_mode.svg && echo "dark OK"
          test -s output/light_mode.svg
          grep -q "<svg" output/light_mode.svg && echo "light OK"