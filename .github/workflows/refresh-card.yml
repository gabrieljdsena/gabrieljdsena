name: ASCII profile card

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            login: gabrieljdsena
            uptimeStart: 2026-01-01

            art:
              seed: daily
              columns: 42
              rows: 20
              scale: 2.4
              warp: 2.4
              bands: 3.4
              contrast: 2.6

            card:
              align: left
              lines:
                - { type: header, text: 'gabrieljdsena' }
                - { type: kv, key: Role, value: 'Developer' }
                - { type: kv, key: Uptime, value: '{uptime} on GitHub' }
                - { type: blank }
                - { type: section, title: GitHub Stats }
                - { type: kv, key: Repos, value: '{repos}' }
                - { type: kv, key: Stars, value: '{stars}' }
                - { type: kv, key: Followers, value: '{followers}' }
                - { type: kv, key: Contributions, value: '{contributions} (all time)' }
                - { type: kv, key: Top Languages, value: '{topLanguages}' }

            output:
              dark: dark_mode.svg
              light: light_mode.svg
